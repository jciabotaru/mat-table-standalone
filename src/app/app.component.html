<!-- src/app/report-simple/report-simple.component.html -->
<mat-toolbar color="primary">
  <span>Continuous Mat Table</span>
</mat-toolbar>

<mat-card>
  <div class="toolbar-row">
    <h3>User List</h3>

    <div class="actions">
      <button mat-raised-button color="primary" (click)="generatePdf()" [disabled]="generating">
        {{ generating ? 'Generating…' : 'Generate PDF' }}
      </button>

      <!-- show fallback download link if print was blocked or user prefers download -->
      <a *ngIf="lastPdfUrl" [href]="lastPdfUrl" download="report.pdf" style="margin-left:12px;">
        Download PDF
      </a>
    </div>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" aria-label="User table">
    <ng-container *ngFor="let col of displayedColumns" [matColumnDef]="col">
      <th mat-header-cell *matHeaderCellDef>{{ columnLabels[col] || col }}</th>
      <td mat-cell *matCellDef="let row">{{ row[col] }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
